name: Skill feedback
description: A skill did something unhelpful, or could do better. (remember-this drafts this for you.)
labels: ["skill-feedback"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [guide-me, update-repo, setup-writing-style, setup-llms, brain-dump, check-board, validate-idea, find-papers, plan-method, write, review, think-deeply, clarify, teach-me, remember-this, not sure]
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you said, and what Chaky did. Never paste participant data, API keys, or confidential text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Proposed wording (optional)
      description: A line or two you would add or change in the skill.
